# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - urbanAgents

on:
  push:
    branches:
      - urbanit/main
  workflow_dispatch:
    inputs:
      clean:
        description: Clean the App Service wwwroot before deployment. This removes Orchard Core persistent data stored in App_Data.
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build with dotnet
        run: dotnet build ./src/OrchardCore.Cms.Web/OrchardCore.Cms.Web.csproj --configuration Release --framework net10.0

      - name: dotnet publish
        run: dotnet publish ./src/OrchardCore.Cms.Web/OrchardCore.Cms.Web.csproj --configuration Release --framework net10.0 --no-build --output ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_2628611ACF3B475CAC6622E47E3CE63D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_47994DAC569340678969C1FEDE46C99C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B8CEC385B84947B08EEF460F4CBBB5ED }}

      - name: Deploy to Azure Web App
        if: ${{ inputs.clean != true }}
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'urbanAgents'
          slot-name: 'Production'
          package: .

      - name: Clean and deploy to Azure Web App
        if: ${{ inputs.clean == true }}
        shell: bash
        run: |
          resource_group="$(az webapp list --query "[?name=='urbanAgents'].resourceGroup | [0]" --output tsv)"
          test -n "$resource_group"
          zip --recurse-paths "$RUNNER_TEMP/urbanagents.zip" .
          az webapp deploy \
            --resource-group "$resource_group" \
            --name urbanAgents \
            --slot Production \
            --src-path "$RUNNER_TEMP/urbanagents.zip" \
            --type zip \
            --clean true \
            --restart true \
            --only-show-errors